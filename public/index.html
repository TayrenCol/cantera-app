<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cantera App Dashboard</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #1f2937;
      }
      .layout {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 220px;
        background: #111827;
        color: white;
        padding: 24px 18px;
      }
      .brand {
        font-size: 1.5rem;
        font-weight: bold;
        margin-bottom: 32px;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .nav a {
        color: #d1d5db;
        text-decoration: none;
        padding: 10px 12px;
        border-radius: 8px;
      }
      .nav a:hover {
        background: #1f2937;
      }
      .main {
        flex: 1;
        padding: 32px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 18px;
        margin-bottom: 24px;
      }
      .card {
        background: white;
        border-radius: 12px;
        padding: 18px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      }
      .card h3 {
        margin: 0 0 12px;
        font-size: 0.9rem;
        color: #6b7280;
      }
      .card .value {
        font-size: 1.8rem;
        font-weight: bold;
      }
      .content {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 24px;
      }
      .panel {
        background: white;
        border-radius: 12px;
        padding: 18px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
      }
      th, td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid #e5e7eb;
      }
      .badge {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: bold;
      }
      .paid { background: #dcfce7; color: #166534; }
      .pending { background: #fef3c7; color: #92400e; }
      ul {
        padding-left: 18px;
      }
      li { margin-bottom: 10px; }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">Cantera</div>
        <nav class="nav">
          <a href="#">Dashboard</a>
          <a href="#">Estudiantes</a>
          <a href="#">Pagos</a>
          <a href="#">Clases</a>
          <a href="#">Configuración</a>
        </nav>
      </aside>

      <main class="main">
        <div class="header">
          <h1>Dashboard inicial</h1>
          <button>+ Nuevo registro</button>
        </div>

        <section id="stats" class="cards"></section>

        <div class="content">
          <section class="panel">
            <h2>Pagos recientes</h2>
            <table>
              <thead>
                <tr>
                  <th>Alumno</th>
                  <th>Concepto</th>
                  <th>Monto</th>
                  <th>Estado</th>
                </tr>
              </thead>
              <tbody id="payments"></tbody>
            </table>
          </section>

          <section class="panel">
            <h2>Alertas</h2>
            <ul id="alerts"></ul>
          </section>
        </div>
      </main>
    </div>

    <script>
      async function loadDashboard() {
        const response = await fetch('/api/dashboard/overview');
        const data = await response.json();

        const stats = document.getElementById('stats');
        const cards = [
          { label: 'Total alumnos', value: data.stats.totalStudents },
          { label: 'Activos', value: data.stats.activeStudents },
          { label: 'Ingresos del mes', value: `$${data.stats.monthlyIncome.toLocaleString()}` },
          { label: 'Pagos pendientes', value: data.stats.pendingPayments },
          { label: 'Clases hoy', value: data.stats.classesToday },
          { label: 'Membresías activas', value: data.stats.activeMemberships },
        ];

        stats.innerHTML = cards.map(card => `
          <div class="card">
            <h3>${card.label}</h3>
            <div class="value">${card.value}</div>
          </div>
        `).join('');

        const payments = document.getElementById('payments');
        payments.innerHTML = data.recentPayments.map(item => `
          <tr>
            <td>${item.student}</td>
            <td>${item.concept}</td>
            <td>$${item.amount.toLocaleString()}</td>
            <td><span class="badge ${item.status === 'Pagado' ? 'paid' : 'pending'}">${item.status}</span></td>
          </tr>
        `).join('');

        const alerts = document.getElementById('alerts');
        alerts.innerHTML = data.alerts.map(item => `<li>${item}</li>`).join('');
      }

      loadDashboard();
    </script>
  </body>
</html>
